# 构建 FigCraft 的 OTools 插件前端（WASM → dist/）并上传产物。
# 触发：push 到 main、PR、手动。
#
# 本 workflow 只构建**前端**。插件是纯前端的（没有 native cdylib），
# 所以产物就是 dist/ 这一份静态资源，拷到 otools 仓库的
# plugins/otools-figcraft/dist 即可用。
name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: 安装 trunk
        run: cargo install trunk --locked

      - name: 缓存 cargo 与 trunk 工具
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
            ~/.cache/trunk
          key: figcraft-wasm-${{ runner.os }}-${{ hashFiles('shell/Cargo.lock', 'upstream/Cargo.lock') }}
          restore-keys: figcraft-wasm-${{ runner.os }}-

      - name: 构建 dist/
        run: node scripts/build-wasm.mjs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: otools-figcraft-dist
          path: dist/
          if-no-files-found: error
